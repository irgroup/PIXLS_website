title: "PIXLS | Preprint Information eXtraction for Life Sciences"
description: "PIXLS is a DFG-funded research project by TH Köln and ZB MED bringing multimodal information extraction, vision-language models, and synthetic relevance assessment to life science preprints."
keywords: "PIXLS, DFG, Preprint, Information Extraction, Life Sciences, REANIMATOR, VLM, RAG, Multimodal Retrieval, TH Köln, ZB MED"
url: "https://irgroup.github.io/PIXLS_website/"
og_description: "DFG-funded project developing multimodal document parsing, synthetic relevance assessment, and generative retrieval for 530,000+ preprints."

