<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" fill="none" role="img" aria-label="PIXLS Logo">
  <defs>
    <style>
      .brand-box { rx: 5px; }
      .brand-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: 2px; }
    </style>
  </defs>
  
  <!-- Left Graphic Emblem: Monolithic structured data blocks -->
  <g transform="translate(0, 4)">
    <!-- Base block 1 (Teal) -->
    <rect class="brand-box" x="0" y="0" width="26" height="26" fill="#388786" />
    <path d="M7 13H19M13 7V19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Base block 2 (Olive) -->
    <rect class="brand-box" x="30" y="0" width="26" height="26" fill="#877A37" />
    <circle cx="43" cy="13" r="5" fill="#ffffff" />
    
    <!-- Base block 3 (Berry) -->
    <rect class="brand-box" x="0" y="30" width="26" height="26" fill="#873774" />
    <rect x="6" y="37" width="14" height="11" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="6" y1="42.5" x2="20" y2="42.5" stroke="#ffffff" stroke-width="1.8" />
    
    <!-- Base block 4 (Dark Teal accent) -->
    <rect class="brand-box" x="30" y="30" width="26" height="26" fill="#255a59" />
    <path d="M37 47L43 37L49 47" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Main Typographic Brand Wordmark -->
  <g transform="translate(74, 4)">
    <rect x="0" y="4" width="210" height="48" rx="4" fill="#388786" />
    <text x="18" y="39" class="brand-text">P I X L S</text>
    <rect x="216" y="4" width="12" height="48" rx="2" fill="#877A37" />
    <rect x="232" y="4" width="12" height="48" rx="2" fill="#873774" />
  </g>
</svg>
