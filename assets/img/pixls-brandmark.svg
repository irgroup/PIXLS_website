<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none" role="img" aria-label="PIXLS Project Logo">
  <defs>
    <style>
      .brand-box { rx: 6px; }
      .brand-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
      .sub-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10.5px; fill: #2b3a39; letter-spacing: 1.8px; text-transform: uppercase; }
      .accent-dot { fill: #873774; }
    </style>
  </defs>
  
  <!-- Left Graphic Emblem: Monolithic structured data block -->
  <g transform="translate(0, 10)">
    <!-- Base block 1 (Teal) -->
    <rect class="brand-box" x="0" y="0" width="32" height="32" fill="#388786" />
    <path d="M9 16H23M16 9V23" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Base block 2 (Olive) -->
    <rect class="brand-box" x="38" y="0" width="32" height="32" fill="#877A37" />
    <circle cx="54" cy="16" r="6" fill="#ffffff" />
    
    <!-- Base block 3 (Berry) -->
    <rect class="brand-box" x="0" y="38" width="32" height="32" fill="#873774" />
    <rect x="7" y="47" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <line x1="7" y1="54" x2="25" y2="54" stroke="#ffffff" stroke-width="2" />
    
    <!-- Base block 4 (Teal Darker / Modern accent) -->
    <rect class="brand-box" x="38" y="38" width="32" height="32" fill="#255a59" />
    <path d="M46 60L54 46L62 60" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Main Typographic Brand Wordmark -->
  <g transform="translate(86, 0)">
    <!-- Monolithic container for title -->
    <rect x="0" y="8" width="220" height="48" rx="4" fill="#388786" />
    <text x="18" y="45" class="brand-text">P I X L S</text>
    <rect x="226" y="8" width="12" height="48" rx="2" fill="#877A37" />
    <rect x="242" y="8" width="12" height="48" rx="2" fill="#873774" />
    
    <!-- Subtitle tagline -->
    <text x="2" y="74" class="sub-text">PREPRINT INFORMATION EXTRACTION</text>
    <text x="2" y="86" class="sub-text" fill="#388786" style="font-weight: 700; fill: #388786;">FOR LIFE SCIENCES</text>
  </g>
</svg>
